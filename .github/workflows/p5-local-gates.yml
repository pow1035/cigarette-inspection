name: Local gates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p5-local-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-local-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-p5.txt

      - name: Install gate dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libxml2-utils ripgrep
          python -m pip install --requirement requirements-p5.txt

      - name: Run exact core local gates
        run: ./scripts/run_all_local_gates.sh --core

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          ./scripts/validate_powershell_scripts.ps1 `
            -RequireScriptAnalyzer
          ./tests/powershell/test_validate_powershell_scripts.ps1

      - name: Report controlled P5 input readiness
        run: |
          set +e
          python scripts/p5_input_readiness.py \
            --require-reviewed --require-fallback \
            --output "$RUNNER_TEMP/p5-input-readiness.json"
          status=$?
          set -e
          if [ "$status" -eq 3 ]; then
            echo "P5 controlled inputs are present but invalid or mismatched" >&2
            exit 3
          fi
          python - "$RUNNER_TEMP/p5-input-readiness.json" "$status" <<'PY'
          import json
          import sys

          report = json.load(open(sys.argv[1], encoding="utf-8"))
          status = int(sys.argv[2])
          allowed_missing = {"reviewed_truth", "fallback_baseline"}
          if report.get("invalid_or_mismatched_required_count") != 0:
              raise SystemExit("P5 readiness report contains invalid/mismatched required inputs")
          missing = set(report.get("missing_required", []))
          if not missing <= allowed_missing:
              raise SystemExit(f"unexpected missing P5 inputs: {sorted(missing - allowed_missing)}")
          if status == 0 and not report.get("ready"):
              raise SystemExit("readiness exit 0 but report is not ready")
          if status == 2 and report.get("ready"):
              raise SystemExit("readiness exit 2 but report is ready")
          if status not in (0, 2):
              raise SystemExit(f"unexpected readiness exit status: {status}")
          PY
          if [ "$status" -eq 2 ]; then
            echo "P5 controlled reviewed-truth/fallback artifacts are not in this checkout; pilot evaluation remains blocked"
          elif [ "$status" -eq 0 ]; then
            echo "P5 controlled inputs are ready for the requested scope"
          else
            echo "Unexpected P5 readiness exit status: $status" >&2
            exit "$status"
          fi
