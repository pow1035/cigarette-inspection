<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CigVision - P5 人工标注工作台</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-block">
        <span class="brand-mark" aria-hidden="true">CV</span>
        <div>
          <h1>CigVision 人工标注</h1>
          <p id="sessionMeta">正在加载标注会话……</p>
        </div>
      </div>
      <div class="progress-block" aria-label="标注进度">
        <div class="progress-copy">
          <span id="progressText">已完成 0 / 0 张</span>
          <span id="progressPercent">0%</span>
        </div>
        <div class="progress-track"><span id="progressBar"></span></div>
      </div>
      <div class="header-actions">
        <label class="operator-field" for="operatorId">
          <span>标注人 ID</span>
          <input id="operatorId" type="text" maxlength="64" autocomplete="off" placeholder="必填：姓名或工号">
        </label>
        <button id="saveBtn" class="button primary" type="button" title="保存更改（Ctrl+S）">保存</button>
        <button id="exportBtn" class="button" type="button" title="导出第一轮人工标注">导出首标</button>
      </div>
    </header>

    <main class="workbench">
      <aside class="image-panel" aria-label="图片队列">
        <div class="panel-heading">
          <div>
            <h2>图片队列</h2>
            <span id="imageCount">共 0 张</span>
          </div>
        </div>
        <div class="list-tools">
          <label class="search-field" for="imageSearch">
            <span aria-hidden="true">搜索</span>
            <input id="imageSearch" type="search" placeholder="文件名或 SHA-256">
          </label>
          <label for="statusFilter" class="sr-only">按状态筛选</label>
          <select id="statusFilter" title="按标注状态筛选图片">
            <option value="ALL">全部状态</option>
            <option value="PENDING">未完成</option>
            <option value="COMPLETE">已完成</option>
            <option value="OK">正常（OK）</option>
            <option value="NG">缺陷（NG）</option>
            <option value="REVIEW">待确认（REVIEW）</option>
          </select>
        </div>
        <div id="imageList" class="image-list" role="listbox" aria-label="图片列表"></div>
        <div class="queue-nav">
          <button id="prevBtn" class="icon-button" type="button" title="上一张（左方向键）" aria-label="上一张">&lt;</button>
          <span id="queuePosition">第 0 / 0 张</span>
          <button id="nextBtn" class="icon-button" type="button" title="下一张（右方向键）" aria-label="下一张">&gt;</button>
        </div>
      </aside>

      <section class="viewport-panel" aria-label="图片标注区">
        <div class="viewport-toolbar">
          <div class="tool-group" role="group" aria-label="标注工具">
            <button class="tool-button active" id="selectTool" type="button" data-tool="select" aria-pressed="true" title="选择、移动或调整框（V）">选择框</button>
            <button class="tool-button" id="drawTool" type="button" data-tool="draw" aria-pressed="false" title="新建缺陷框（B）">绘制框</button>
          </div>
          <div class="tool-separator"></div>
          <div class="tool-group" role="group" aria-label="图片缩放">
            <button class="tool-button active" id="fitBtn" type="button" aria-pressed="true" title="适应标注区">自适应</button>
            <button class="tool-button" id="actualBtn" type="button" aria-pressed="false" title="按原始尺寸显示">100%</button>
          </div>
          <div class="tool-separator"></div>
          <div class="tool-group" role="group" aria-label="图片来源">
            <button class="tool-button active" id="originalBtn" type="button" aria-pressed="true" title="显示可编辑的原始图片">原图</button>
            <button class="tool-button" id="previewBtn" type="button" aria-pressed="false" title="显示只读的模型预览">模型预览</button>
          </div>
          <span class="viewport-info" id="viewportInfo">尚未选择图片</span>
          <button id="deleteBoxBtn" class="tool-button danger" type="button" title="删除选中的框（Delete）" disabled>删除框</button>
        </div>
        <div id="canvasStage" class="canvas-stage" tabindex="0" aria-label="图片标注画布。使用“绘制框”创建缺陷框，使用“选择框”编辑。">
          <canvas id="annotationCanvas"></canvas>
          <div id="emptyViewport" class="viewport-message">请从左侧队列选择图片</div>
          <div id="imageLoading" class="viewport-message hidden">正在加载图片……</div>
        </div>
        <div class="viewport-status">
          <span><i class="legend-box human"></i>人工确认框</span>
          <span><i class="legend-box prediction"></i>模型预标注框</span>
          <span id="selectedBoxReadout">未选择缺陷框</span>
        </div>
      </section>

      <aside class="inspector-panel" aria-label="图片检查面板">
        <section class="inspector-section decision-section">
          <div class="section-heading">
            <h2>图片结论</h2>
            <span id="predictedDecision" class="prediction-label">模型预测：-</span>
          </div>
          <div class="segmented decision-control" role="group" aria-label="图片结论">
            <button type="button" data-decision="OK" aria-pressed="false">正常 OK</button>
            <button type="button" data-decision="NG" aria-pressed="false">缺陷 NG</button>
            <button type="button" data-decision="REVIEW" aria-pressed="false">待确认</button>
          </div>
        </section>

        <section class="inspector-section class-section">
          <div class="section-heading">
            <label for="categorySelect">当前缺陷类别</label>
            <span id="categoryState"></span>
          </div>
          <select id="categorySelect" title="为选中框或新绘制框指定缺陷类别"></select>
        </section>

        <section class="inspector-section box-section">
          <div class="section-heading">
            <h2>缺陷框</h2>
            <span id="boxCount">0</span>
          </div>
          <div id="boxList" class="box-list" role="listbox" aria-label="缺陷框列表"></div>
        </section>

        <section class="inspector-section notes-section">
          <label for="notes">标注备注</label>
          <textarea id="notes" rows="4" maxlength="2000" placeholder="选择“待确认”时必须填写原因"></textarea>
          <div class="field-meta"><span id="noteHint"></span><span id="noteCount">0 / 2000</span></div>
        </section>

        <section class="inspector-section image-detail-section">
          <h2>图片信息</h2>
          <dl class="detail-grid">
            <dt>文件名</dt><dd id="detailFile">-</dd>
            <dt>尺寸</dt><dd id="detailSize">-</dd>
            <dt>SHA-256</dt><dd id="detailSha" title="">-</dd>
            <dt>标注状态</dt><dd id="detailState">-</dd>
          </dl>
        </section>

        <div class="completion-area">
          <label class="completion-check" for="completeToggle">
            <input id="completeToggle" type="checkbox">
            <span>确认本张标注完成</span>
          </label>
          <p id="completionHint">请先选择本张图片的结论。</p>
        </div>
      </aside>
    </main>

    <footer class="statusbar">
      <div id="saveStatus" class="save-status" role="status" aria-live="polite">
        <span class="status-dot"></span><span>正在连接……</span>
      </div>
      <div class="shortcut-hints" aria-hidden="true">
        <span>方向键切换图片</span><span>Delete 删除框</span><span>Ctrl+S 保存</span>
      </div>
      <div id="revisionStatus">状态版本 -</div>
    </footer>
  </div>

  <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script src="/static/app.js" defer></script>
</body>
</html>
